name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Types, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting & linting (Biome)
        run: npm run check:ci

      - name: Verify TypeScript types
        run: npm run type-check

      - name: Run test suite
        run: npm test

      - name: Build production bundle (Next.js App Router)
        env:
          HUGGINGFACE_API_KEY: "ci-dummy-key"
          TURSO_DATABASE_URL: "file:local.db"
          BETTER_AUTH_SECRET: "ci-dummy-secret-at-least-32-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          ENCRYPTION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm run build
