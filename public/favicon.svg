<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Dark modern background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040407"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <!-- Neon accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Subtle glow for accents -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft inner vignette -->
    <radialGradient id="vignette" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.04" />

  <!-- Vignette overlay for depth -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#vignette)" />

  <!-- Sparkles/AI icon with neon accent and glow -->
  <path d="M16 6L17.5 10.5L22 12L17.5 13.5L16 18L14.5 13.5L10 12L14.5 10.5L16 6Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <path d="M22 18L23 20.5L25.5 21.5L23 22.5L22 25L21 22.5L18.5 21.5L21 20.5L22 18Z" fill="url(#accentGrad)" opacity="0.85" filter="url(#glow)"/>
  <path d="M10 18L10.75 20L12.75 20.75L10.75 21.5L10 23.5L9.25 21.5L7.25 20.75L9.25 20L10 18Z" fill="url(#accentGrad)" opacity="0.65" filter="url(#glow)"/>
</svg>
